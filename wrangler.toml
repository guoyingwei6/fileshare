name = "fileshare-r2"
main = "worker/src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true
routes = [{ pattern = "fileshare.guoyingwei.top/*", zone_name = "guoyingwei.top" }]

[assets]
directory = "./public"
run_worker_first = ["/upload", "/files", "/files/*", "/folder/*"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "fileshare-uploads"
